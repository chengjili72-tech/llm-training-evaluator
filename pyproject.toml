[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-training-evaluator"
version = "0.1.0"
description = "Inspect layer-wise token predictions, token embeddings, and MoE routing in Hugging Face causal language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff==0.15.22",
]
cuda-low-memory = [
  "bitsandbytes>=0.43",
]

[project.scripts]
llm-training-evaluator = "llm_training_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
