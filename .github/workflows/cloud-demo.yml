name: cloud-demo

on:
  workflow_dispatch:
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" --no-deps
          pip install accelerate safetensors "transformers<5" pytest ruff==0.15.22
      - name: Run unit tests
        run: |
          ruff check src tests scripts
          pytest -q
      - name: Run real Hugging Face analysis
        run: |
          llm-training-evaluator analyze \
            --model trl-internal-testing/tiny-random-LlamaForCausalLM \
            --samples examples/cloud_demo.jsonl \
            --output outputs/model.json \
            --top-k 5 \
            --similarity-top-k 5 \
            --device-map none \
            --no-moe
      - name: Compare identical checkpoints
        run: |
          llm-training-evaluator compare \
            --model-a trl-internal-testing/tiny-random-LlamaForCausalLM \
            --model-b trl-internal-testing/tiny-random-LlamaForCausalLM \
            --samples examples/cloud_demo.jsonl \
            --output-dir outputs/comparison \
            --top-k 5 \
            --similarity-top-k 5 \
            --device-map none \
            --no-moe
      - name: Print compact results
        run: |
          python scripts/summarize_demo.py \
            outputs/model.json \
            outputs/comparison/comparison.json | tee outputs/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-demo-results
          path: outputs/
          if-no-files-found: error
